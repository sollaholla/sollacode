<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#161616" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        const LIGHT_BACKGROUND = "#ffffff";
        const DARK_BACKGROUND = "#161616";
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');
        try {
          const storedTheme = window.localStorage.getItem("t3code:theme");
          const theme =
            storedTheme === "light" || storedTheme === "dark" || storedTheme === "system"
              ? storedTheme
              : "system";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = theme === "dark" || (theme === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
          const chromeColor = isDark ? DARK_BACKGROUND : LIGHT_BACKGROUND;
          document.documentElement.style.backgroundColor = chromeColor;
          themeColorMeta?.setAttribute("content", chromeColor);
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = DARK_BACKGROUND;
          themeColorMeta?.setAttribute("content", DARK_BACKGROUND);
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family:
          "DM Sans Variable",
          "DM Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      html.dark body {
        background: #161616;
        color: #f5f5f5;
      }

      #boot-shell {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
      }

      #boot-shell-card {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }

      #boot-shell.boot-shell-failed #boot-shell-card {
        width: min(360px, calc(100vw - 48px));
        height: auto;
        flex-direction: column;
        gap: 12px;
        text-align: center;
      }

      #boot-shell-status {
        margin: 0;
        color: inherit;
        font-size: 14px;
        line-height: 1.5;
      }

      #boot-shell-retry {
        appearance: none;
        border: 1px solid color-mix(in srgb, currentColor 22%, transparent);
        border-radius: 10px;
        padding: 8px 14px;
        background: color-mix(in srgb, currentColor 8%, transparent);
        color: inherit;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
    <title>Solla Code</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="Solla Code splash screen">
          <img id="boot-shell-logo" src="/apple-touch-icon.png" alt="Solla Code" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const BOOT_TIMEOUT_MS = 8000;
        const RETRY_QUERY_KEY = "solla_boot_retry";
        const RETRY_STORAGE_KEY = "solla:boot-recovery:v1";
        const bootShell = document.getElementById("boot-shell");
        const bootShellCard = document.getElementById("boot-shell-card");
        if (!bootShell || !bootShellCard) return;

        const removeRetryMarker = () => {
          try {
            window.sessionStorage.removeItem(RETRY_STORAGE_KEY);
            const url = new URL(window.location.href);
            if (!url.searchParams.has(RETRY_QUERY_KEY)) return;
            url.searchParams.delete(RETRY_QUERY_KEY);
            window.history.replaceState(window.history.state, "", url);
          } catch {
            // Storage and history can be unavailable in strict private modes.
          }
        };

        const appBooted = () => !document.getElementById("boot-shell");
        const observer = new MutationObserver(() => {
          if (!appBooted()) return;
          observer.disconnect();
          removeRetryMarker();
        });
        observer.observe(document.getElementById("root"), { childList: true, subtree: true });

        const retryWithFreshShell = () => {
          try {
            window.sessionStorage.setItem(RETRY_STORAGE_KEY, "attempted");
            const url = new URL(window.location.href);
            url.searchParams.set(RETRY_QUERY_KEY, Date.now().toString());
            window.location.replace(url.toString());
          } catch {
            window.location.reload();
          }
        };

        const showRecovery = () => {
          bootShell.classList.add("boot-shell-failed");
          bootShellCard.replaceChildren();

          const logo = document.createElement("img");
          logo.id = "boot-shell-logo";
          logo.src = "/apple-touch-icon.png";
          logo.alt = "Solla Code";

          const status = document.createElement("p");
          status.id = "boot-shell-status";
          status.textContent = "Solla Code did not finish loading.";

          const retry = document.createElement("button");
          retry.id = "boot-shell-retry";
          retry.type = "button";
          retry.textContent = "Retry";
          retry.addEventListener("click", retryWithFreshShell);

          bootShellCard.append(logo, status, retry);
        };

        window.setTimeout(() => {
          if (appBooted()) {
            removeRetryMarker();
            return;
          }

          let alreadyRetried = false;
          try {
            alreadyRetried = window.sessionStorage.getItem(RETRY_STORAGE_KEY) === "attempted";
          } catch {
            // A cache-busting retry is still safe when storage is unavailable.
          }
          if (alreadyRetried) {
            showRecovery();
            return;
          }
          retryWithFreshShell();
        }, BOOT_TIMEOUT_MS);
      })();
    </script>
  </body>
</html>
