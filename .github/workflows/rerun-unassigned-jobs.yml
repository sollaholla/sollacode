name: Rerun Unassigned Jobs

# GitHub sometimes has no macOS arm64 runner free and cancels a job after 15
# minutes without starting it, which stops a release until someone reruns it.
on:
  workflow_run:
    workflows: [Release, CI]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    name: Rerun jobs no runner picked up
    # Only the first attempt starts a watcher; this one follows every rerun.
    # Scheduled nightlies are left alone: the next one retries in three hours,
    # and every failed attempt here would email the maintainer.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.event != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          run-install: false

      - name: Rerun until a runner picks them up
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/rerun-unassigned-jobs.ts
